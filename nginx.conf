limit_conn_zone $uri zone=uri:10m;
#limit_req_zone $uri zone=one:10m rate=10r/s;

# $acao set to Access-Control-Allow-Origin value or "*" if not set:
map $upstream_http_access_control_allow_origin $acao {
    '' "*";
}

server {
    server_name query.YOURDOMAIN.com;
    server_tokens off;
    large_client_header_buffers 4 64k;

    location / {
        add_header Access-Control-Allow-Origin $acao;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Access-Control-Allow-Origin "*";
        proxy_pass http://127.0.0.1:9393/;
    }

    location /repo {
        # Only SPARQL queries are exposed here. RDF4J has no authentication and
        # deletes a repository on DELETE of its URL, so without this,
        # DELETE /repo/<id> destroys a repository from anywhere. GET implies
        # HEAD. Updates go to /repositories/<id>/statements, which the rewrites
        # below cannot reach, but reject them on the repository URL as well.
        # This does not catch an update sent as a form-encoded POST body, which
        # nginx cannot inspect.
        limit_except GET POST OPTIONS {
            deny all;
        }
        if ($arg_update) {
            return 405;
        }
        if ($content_type ~* "application/sparql-update") {
            return 405;
        }

        rewrite ^/repo/(.*)/(.*)$ /rdf4j-server/repositories/$1_$2 break;
        rewrite ^/repo/(.*)$ /rdf4j-server/repositories/$1 break;
        add_header Access-Control-Allow-Origin $acao;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Access-Control-Allow-Origin "*";
        # ----------
        # To avoid deadlock problem with rdf4j-workbench:5.0.2:
        limit_conn uri 1;
        #limit_req zone=one burst=100;
        # ----------
        proxy_pass http://127.0.0.1:8081/;
    }

}
