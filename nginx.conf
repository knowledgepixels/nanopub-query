# Reference nginx configuration for a public Nanopub Query instance.
#
# Put this file into /etc/nginx/sites-enabled/ (or include it from your main
# configuration), replace query.YOURDOMAIN.com, and run `nginx -t` followed by
# `systemctl reload nginx`. Then run `certbot --nginx` and select the server
# name: it adds the `listen 443` / ssl_certificate lines and the port-80
# redirect itself. The server block is HTTP-only as written; that is
# deliberate, not an omission.
#
# This configuration is load-bearing for security, not just for TLS: the Query
# app (localhost:9393) and RDF4J (localhost:8081) have no authentication, and
# RDF4J deletes a whole repository on a DELETE of its URL. Only what the
# locations below let through is exposed.

# Per-IP rate and concurrency limits, against abusive clients. Servers of your
# own that query this instance heavily (e.g. a Nanodash instance, including
# one on this host reaching it via its public name) can be exempted by adding
# their IP addresses here: an empty key disables the limits for a request.
geo $npq_exempt {
    default   0;
    127.0.0.1 1;
#   203.0.113.10 1;  # e.g. this host's own public IP
}
map $npq_exempt $npq_limit_key {
    0 $binary_remote_addr;
    1 "";
}
limit_req_zone $npq_limit_key zone=npq_req:10m rate=10r/s;
limit_conn_zone $npq_limit_key zone=npq_conn:10m;

server {
    server_name query.YOURDOMAIN.com;
    server_tokens off;
    large_client_header_buffers 4 64k;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nCrawl-delay: 30\nDisallow: /\n";
    }

    location / {
        limit_req zone=npq_req burst=20 nodelay;
        limit_conn npq_conn 16;

        # CORS preflight. The app answers OPTIONS with 405, so this 204 IS the
        # whole preflight response. Access-Control-Allow-Headers is required:
        # without it, browsers block every request with a non-safelisted
        # Content-Type before it is sent. (`Allow` is not a CORS header.)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, POST, OPTIONS' always;
            add_header Allow 'GET, HEAD, POST, OPTIONS' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:9393/;
    }

    # SPARQL endpoints, served by RDF4J directly: /repo/<name> and
    # /repo/<kind>/<id> map to repositories <name> and <kind>_<id>.
    location /repo {
        limit_req zone=npq_req burst=20 nodelay;
        limit_conn npq_conn 16;

        # CORS preflight, as above. This must come BEFORE the rewrites below:
        # `rewrite ... break` ends the processing of `if` blocks, so a
        # preflight check placed after them never runs.
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, POST, OPTIONS' always;
            add_header Allow 'GET, HEAD, POST, OPTIONS' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Only SPARQL queries are exposed here. RDF4J deletes a repository on
        # DELETE of its URL, so without this, DELETE /repo/<id> destroys a
        # repository from anywhere. GET implies HEAD. Updates go to
        # /repositories/<id>/statements, which the rewrites below cannot reach,
        # but reject them on the repository URL as well. This does not catch an
        # update sent as a form-encoded POST body, which nginx cannot inspect.
        limit_except GET POST OPTIONS {
            deny all;
        }
        if ($arg_update) {
            return 405;
        }
        if ($content_type ~* "application/sparql-update") {
            return 405;
        }

        rewrite ^/repo/(.*)/(.*)$ /rdf4j-server/repositories/$1_$2 break;
        rewrite ^/repo/(.*)$ /rdf4j-server/repositories/$1 break;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Clients are cut off after 10 s. RDF4J keeps evaluating an abandoned
        # query up to RDF4J_QUERY_TIMEOUT_SECONDS (see docker-compose.yml).
        proxy_read_timeout 10;
        proxy_connect_timeout 10;
        proxy_send_timeout 10;
        proxy_pass http://127.0.0.1:8081/;
    }

    listen 80;
}
