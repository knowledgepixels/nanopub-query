services:
  query:
    build: .
    image: nanopub/query:latest
    restart: unless-stopped
    ports:
      - "9393:9393"
      # :9394 is only accessible from localhost as it is used for the /metrics endpoint
      - "127.0.0.1:9394:9394"
    volumes:
      # For the local nanopub loader (optional).
      # If not used, Query will load the nanopubs from the Registry with Jelly.
      - ./load:/app/load
    environment:
      - ENDPOINT_TYPE=rdf4j
      - ENDPOINT_BASE=http://rdf4j:8080/rdf4j-server/
      - REGISTRY_FIXED_URL=https://registry.knowledgepixels.com/
      - RDF4J_PROXY_HOST=rdf4j
      # Server-side SPARQL evaluation limit (seconds) injected into every /repo
      # and /api request proxied to rdf4j; 0 disables. The public edge cuts
      # clients at 10s but that never stops server-side evaluation — abandoned
      # heavy queries pile up and can spiral the changeset overlay (2026-08-21
      # CPU storm). Keep well above the edge timeout: aborted evaluations
      # concurrent with writes are a suspected corruption trigger upstream
      # (rdf4j#5960/#4806), so this is a backstop, not a first-line limit.
      - RDF4J_QUERY_TIMEOUT_SECONDS=${RDF4J_QUERY_TIMEOUT_SECONDS:-60}
      # Client-side socket timeout (ms) for this app's own reads from rdf4j
      # (Utils.getHttpRequestConfig). The former 10s default was too aggressive for
      # a store that is slow rather than broken: the read raises
      # QueryInterruptedException, the loader's generic retry loops treat that as
      # transient, and the retries add load, which makes the next read slower still.
      # That storm saturated a fleet node on 2026-08-31. A timeout costs nothing when
      # reads are fast, and reads normally complete in tens of milliseconds.
      #
      # Keep this in step with the default in Utils.getHttpRequestConfig, or the code
      # and the deployment disagree about what "default" means.
      #
      # Trade-off: a genuinely hung backend now surfaces 3x slower, and each stuck
      # read holds a pool connection 3x longer. Acceptable because detection no
      # longer depends on it — JellyNanopubLoader logs "Loader wedged" after
      # WEDGE_ALERT_THRESHOLD consecutive failures with no counter movement.
      - NANOPUB_QUERY_FETCHING_SOCKET_TIMEOUT=${NANOPUB_QUERY_FETCHING_SOCKET_TIMEOUT:-30000}
      # One-shot repair/resync switch: re-streams the whole registry at startup;
      # per-repo isLoaded checks skip everything already present, so WITHOUT a
      # store wipe this fills holes (missing nanopubs) idempotently. Set it for
      # one `up -d`, then recreate again without it so later restarts don't
      # re-trigger the sweep.
      #
      # ONLY on a wiped or out-of-rotation instance. On a live one the sweep
      # cycles all ~2,800 LMDB repos through the 100-slot repo cache against
      # live traffic: point-reads hit the 10s client timeout, batches die on
      # retry backoff (~50 nanopubs/min, ETA days), and the loader state is
      # clobbered meanwhile (status LOADING_INITIAL, counter at sweep position)
      # — measured 2026-08-21. For a bounded hole of RECENT nanopubs, rewind
      # the admin repo instead (npa:hasRegistryLoadCounter to just below the
      # hole + npa:hasStatus "READY", with the container stopped): the update
      # loop re-processes only that window in under a minute.
      - FORCE_RESYNC=${FORCE_RESYNC:-false}
    #     - INIT_WAIT_SECONDS=120   # Only used by the local nanopub loader
    # Public base URL, used only in generated documentation (grlc spec listings,
    # OpenAPI server URLs) — query execution never uses it:
    #     - NANOPUB_QUERY_URL=https://query.knowledgepixels.com/
    # In-cluster base URL used for rewriting SERVICE clauses / query endpoints;
    # defaults to http://query:9393/ (this service). Only set it if the app is
    # reachable under a different in-cluster address. Do NOT point it at the
    # public URL: federated /api traffic would then loop through the public
    # edge and compete with external clients for nginx's per-repo connection
    # limits (issue #142, incident 2026-07-28).
    #     - NANOPUB_QUERY_INTERNAL_URL=http://query:9393/
    # Stop this service BEFORE rdf4j (compose stops dependents first), so the store
    # never has one of our writes in flight when it goes down. An aborted LMDB write
    # is the incomplete-rollback condition behind the value-ID remap corruption of
    # eclipse-rdf4j/rdf4j#4775 — the 2026-08-20 and 2026-08-24 events scrambled
    # metadata across subjects and swallowed nanopubs outright. depends_on also
    # orders startup (rdf4j first), which is harmless: the loader already retries
    # while the backend comes up.
    depends_on:
      - rdf4j
    # Docker's default is 10 s, which SIGKILLs the JVM in the middle of whatever it
    # was writing — the very thing the shutdown hook exists to avoid. Kept above
    # NANOPUB_QUERY_SHUTDOWN_QUIESCE_SECONDS (90 s) so the quiesce can finish and
    # still leave room for closing repositories; a full space-state build alone can
    # run ~70 s. Raise both together or neither.
    stop_grace_period: 150s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  rdf4j:
    # 6.0.0 (from 5.3.2, 2026-08-12): upstream unified LMDB transaction
    # handling via TxnManager (ValueStore rewritten), which may resolve our
    # three LMDB defects (eclipse-rdf4j/rdf4j#5970); deployed together with the
    # client-side removal of SERIALIZABLE transactions (the suspected
    # corruption trigger), so either change may stop the malloc-corruption
    # crash loop.
    #
    # MIGRATION REQUIRED — this is not a plain image swap: 6.x changed the LMDB
    # value-ID layout and refuses to open 5.x stores ("Directory contains data
    # from an older unsupported version of LmdbStore"). Deploying this bump
    # means stopping the stack, wiping ./data/rdf4j/data, and letting the query
    # app re-ingest everything from the Registry (a fresh admin repo makes the
    # loader bootstrap from counter 0). The image also changed the tomcat uid
    # (101 -> 100); init.sh re-chowns the mounted volumes at startup. The 5.3.x
    # client library in the query app stays compatible (REST protocol 12).
    image: ${RDF4J_IMAGE:-eclipse/rdf4j-workbench}:${RDF4J_IMAGE_TAG:-6.0.0-tomcat}
    restart: unless-stopped
    # Start as root so init.sh can apt-get install curl (missing from the
    # 5.3.1-tomcat image but required by the healthcheck). init.sh drops to
    # the tomcat user before launching the JVM.
    user: "0"
    environment:
      # maxConnPerRoute/maxConnTotal: all SERVICE clauses in /api queries are
      # rewritten to this instance's in-cluster URL (NANOPUB_QUERY_INTERNAL_URL,
      # default http://query:9393/), so the whole federation load shares a
      # single HttpClient route inside this container. The RDF4J defaults
      # (25 per route, 50 total) saturate under concurrent federated queries,
      # starving every /api call with "Timeout waiting for connection from
      # pool" (incident 2026-07-28).
      #
      # CORRECTION 2026-08-20 — the earlier sizing reasoned about the wrong
      # failure mode, and the 100 -> 60 reduction made the wedge *more* likely.
      # (The claim that the worker pool is 150 was also wrong: maxThreads="150"
      # sits in a commented-out <Executor> block in the image's server.xml and
      # is not in effect; the active 8080 connector uses Tomcat's default 200.)
      #
      # A thread dump taken on kpxl while genuinely wedged (2026-08-20 05:18Z)
      # shows the real mechanism: a re-entrant deadlock on this single
      # route, not Tomcat thread starvation. The raw dump is not committed;
      # the load-bearing numbers are reproduced below.
      #
      #   - RepositoryFederatedService.select obtains SERVICE results via
      #     SPARQLProtocolSession.getBackgroundTupleQueryResult, which pins a
      #     pooled connection for the entire lifetime of result consumption.
      #   - ServiceQueryEvaluationStep sits under JoinIterator.getInstance, so a
      #     SERVICE inside a join fires one request per binding. An outer query
      #     is therefore mid-iteration over result #1 -- holding a connection --
      #     when it asks the same pool for the connection for result #2.
      #   - Snapshot: 60 of 60 connections held by BackgroundTupleResult
      #     producers blocked in QueueIteration.put on a full ArrayBlockingQueue
      #     (their consumers cannot drain), and 28 threads blocked in
      #     acquireEndpoint. 22 of those 28 were get-view-displays
      #     (repositories/type_11daee46...), which carries 3 nested SERVICE hops.
      #
      # Nobody can proceed; only connectionRequestTimeout (10s) breaks the cycle,
      # which is why the symptom flaps rather than staying dead. Crucially, a
      # SMALLER pool deadlocks at LOWER concurrency, so "fewer leases are needed
      # before the route saturates" -- the old rationale for 60 -- was backwards.
      #
      # Threads were never the binding constraint: the same dump had 42
      # http-nio workers against maxThreads=400. That is also why the maxThreads
      # A/B showed no benefit on its own. Raising the pool is what moves the
      # deadlock threshold, and the thread headroom is what makes it safe.
      #
      # The invariant to preserve is still "outer + federated self-calls <=
      # Tomcat workers", so maxThreads defaults alongside a per-route pool of
      # half its value. Change the two together or not at all.
      #
      # SECOND CEILING (2026-08-20, found the hard way): rdf4j 6.0.0 hardcodes
      # LMDB's reader table at 256 slots, and STOCK 6.0.0 pins one slot per
      # thread (ThreadLocal read txn, freed only on thread death). A 400-thread
      # default therefore drove stock hosts into intermittent
      # "MDB_READERS_FULL: Environment maxreaders limit reached" on plain
      # queries (petapico, within a day of the raise). Hosts running the
      # PR#5974 lmdbpool canary pool their readers and are immune (kpxl, no
      # errors under the same load). So the default stays BELOW 256 with
      # headroom: 240 threads / 120 per route / 240 total. A canary host may
      # raise all three in its .env (e.g. 400/200/400).
      #
      # This is mitigation, not a cure: it raises the threshold above realistic
      # concurrency but the circular wait remains reachable. The fix is removing
      # the nesting -- get-view-displays 3 SERVICE hops -> 1, already validated
      # byte-for-byte identical -- plus an upstream report against rdf4j.
      # Keep this block in sync with nanopub-infrastructure/nanopub-query/,
      # which is the deploy source of truth.
      #
      # ExitOnOutOfMemoryError: without it, a heap OOM is survivable in the worst
      # possible way. On kpxl 2026-08-05 the OOM killed the "http-nio-8080-Acceptor"
      # thread (04:17:08) and then the Poller (04:17:30) while the JVM stayed alive
      # spinning in GC. With no acceptor, the socket stays bound but nothing ever
      # accepts: the backlog fills, the kernel drops SYNs, and every client sees a
      # 10 s connect timeout. The process never exits, so `restart: unless-stopped`
      # never fires, and with RDF4J_HEALTHCHECK_RESTART=off nothing else intervenes
      # — the instance sat wedged for 11 hours while still reporting READY.
      # Exiting on the first OOM turns that permanent outage into a ~2 min restart.
      # It also composes with the healthcheck decision rather than fighting it: the
      # JVM only dies when it is already unrecoverable, so this does not reintroduce
      # the mid-write kill risk of issue #142 that turning restarts off avoided.
      #
      # MaxRAMPercentage: the container has no mem_limit, so the JVM default of 25%
      # of *host* RAM applied. Pinning it makes the ceiling explicit and independent
      # of the host the stack lands on.
      #
      # HeapDumpOnOutOfMemoryError: /var/info is host-mounted (./data/info), so the
      # dump survives the exit above and can be opened after the fact. Sized in GB —
      # check free space there before enabling on a small host.
      #
      # PrintConcurrentLocks: makes a SIGQUIT (`kill -3`) thread dump include the
      # "Locked ownable synchronizers" block, i.e. which thread *owns* each
      # java.util.concurrent lock. Without it a plain kill -3 shows waiters but not
      # holders. On 2026-08-05 a dump showed 171 threads parked on one
      # SailSourceBranch ReentrantLock with no way to tell who held it, and the
      # image ships a JRE (no jcmd/jstack), so there was no second way to ask.
      # Zero runtime cost until a dump is requested.
      - JAVA_OPTS=-XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/info/ -XX:MaxRAMPercentage=${RDF4J_MAX_RAM_PERCENTAGE:-50} -XX:+PrintConcurrentLocks -Dorg.eclipse.rdf4j.client.http.connectionTimeout=10000 -Dorg.eclipse.rdf4j.client.http.connectionRequestTimeout=10000 -Dorg.eclipse.rdf4j.client.http.socketTimeout=10000 -Dorg.eclipse.rdf4j.client.http.maxConnPerRoute=${RDF4J_MAX_CONN_PER_ROUTE:-120} -Dorg.eclipse.rdf4j.client.http.maxConnTotal=${RDF4J_MAX_CONN_TOTAL:-240}
      # Used by the healthcheck's federation probe below; defaults to the same
      # in-cluster URL the SERVICE rewrite uses, so the probe tests the real
      # federation route. Set explicitly empty to disable the probe.
      # Tomcat HTTP connector thread pool; see entrypoint/init.sh. Must stay
      # >= 2x maxConnPerRoute (outer query + its own federated self-call).
      - RDF4J_TOMCAT_MAX_THREADS=${RDF4J_TOMCAT_MAX_THREADS:-240}
      - NANOPUB_QUERY_INTERNAL_URL=${NANOPUB_QUERY_INTERNAL_URL-http://query:9393/}
      # Whether a failing healthcheck probe may kill Tomcat. Off by default —
      # see the reasoning above the healthcheck test block.
      - RDF4J_HEALTHCHECK_RESTART=${RDF4J_HEALTHCHECK_RESTART:-off}
    volumes:
      - ./data/rdf4j/data:/var/rdf4j
      - ./data/rdf4j/logs:/usr/local/tomcat/logs
      - ./data/info:/var/info
      - ./entrypoint:/var/entrypoint
    ports:
      # Localhost only: RDF4J has no authentication, and every repository it
      # serves is writable, including via DELETE on the repository URL and via
      # the Workbench UI. Published on all interfaces it is an unauthenticated
      # write endpoint on the public IP, which bypasses whatever the reverse
      # proxy restricts. Note that a host firewall does not help here, since
      # Docker manages its own iptables rules. Reached as http://rdf4j:8080/
      # from the query container, and via the proxy on 127.0.0.1:8081.
      # (Compare the 2026-08-02 Solr wipe on vodex.petapico.org.)
      - "127.0.0.1:8081:8080"
    entrypoint: /var/entrypoint/init.sh
    # Docker's default grace period is 10 s, but a clean Tomcat shutdown here has to
    # close thousands of LMDB repos and measured ~100 s on kpxl (2026-07-31: kill at
    # 13:55:14, port closed 13:56:54). At 10 s every stop became a SIGKILL, which is
    # the hard-kill-mid-write condition implicated in issue #142. Forwarding SIGTERM
    # from init.sh is pointless without giving the shutdown room to finish.
    stop_grace_period: 120s
    healthcheck:
        # If the direct-query curl succeeds, mark the instance as "has been
        # ready". Only force a restart (via pkill) when a probe fails AND we've
        # previously seen it ready -- otherwise we'd kill Tomcat mid-deploy
        # during the start_period (default start_interval is 5s, well below the
        # war-deploy time).
        #
        # Second probe: SERVICE clauses in /api queries loop back through the
        # instance's in-cluster URL, so RDF4J's federation HTTP pool can wedge
        # (leaked connections; incident 2026-07-28) while direct queries stay
        # healthy. Probe that exact route and restart when it no longer
        # answers. Uses NANOPUB_QUERY_INTERNAL_URL (with trailing slash);
        # skipped when explicitly set to empty.
        # restart_tomcat gives Tomcat up to 60 s to stop gracefully before the
        # kill -9: dozens of LMDB repos need to close cleanly, and the previous
        # 10 s window meant effectively every restart was a hard kill — which
        # the 2026-07-29 incident (issue #142) showed can discard acknowledged
        # writes held in a wedged store. The 10-minute backoff prevents restart
        # storms: a persistently wedged repo used to trigger a kill every probe
        # interval, multiplying the data-loss windows; now the probe reports
        # unhealthy without re-killing until the backoff elapses.
        #
        # Auto-restart is OFF by default since 2026-07-31. Both probes still run
        # and still record failures, so a wedge is visible (container goes
        # unhealthy, timestamps land in /var/info/), but nothing kills Tomcat.
        #
        # Why: on 2026-07-31 the healthcheck killed Tomcat 10 times, 7 of them
        # between 12:00 and 13:55 — and it was not curing anything. Each cycle
        # cost ~110 s of downtime (13:55:14 kill -> 13:57:04 back up) and the
        # store re-wedged within 11-20 minutes, so the restart only reset a
        # clock. Meanwhile every kill is a roll of the issue #142 dice:
        # acknowledged, read-back-verified writes reverting. Trading a visible
        # degradation for silent data loss is the wrong way round.
        #
        # Attribution, so the next reader does not repeat our mistake: 8 of the
        # 10 kills came from the FIRST (direct-query) probe, only 2 from the
        # federation probe. /var/info/restart is the kill log;
        # /var/info/federation-restart is written *before* restart_tomcat, which
        # often returns early on the backoff — the two files are not comparable
        # counts. Disabling the federation probe alone would have prevented 2.
        #
        # Re-enable with RDF4J_HEALTHCHECK_RESTART=on once the underlying LMDB
        # ValueStore$ReadTxn leak is confirmed resolved (present through 5.3.2
        # even after #5807; the 6.0.0 TxnManager rework may fix it, but verify
        # in production first — see eclipse-rdf4j/rdf4j#5970).
        test: |
          restart_tomcat() {
            if [ "$$RDF4J_HEALTHCHECK_RESTART" != "on" ]; then
              date >> /var/info/restart-suppressed
              return
            fi
            if [ -f /var/info/restart ]; then
              last_s=$$(date -d "$$(tail -1 /var/info/restart)" +%s 2>/dev/null || echo 0)
              if [ $$(( $$(date +%s) - last_s )) -lt 600 ]; then
                return
              fi
            fi
            date >> /var/info/restart
            pkill -15 java
            i=0
            while [ $$i -lt 12 ] && pgrep java > /dev/null; do
              sleep 5
              i=$$((i + 1))
            done
            if pgrep java > /dev/null; then
              pkill -9 java
            fi
          }
          if ! curl -fsS --retry 2 --max-time 10 --retry-delay 2 --retry-max-time 10 --retry-connrefused \
              "http://localhost:8080/rdf4j-server/repositories/full?query=select%2Awhere%7B%3Fs%3Cx%3A%3E%3Fo%7Dlimit1" > /dev/null; then
            if [ -f /var/info/ready ]; then
              restart_tomcat
            fi
            exit 1
          fi
          touch /var/info/ready
          if [ -n "$$NANOPUB_QUERY_INTERNAL_URL" ]; then
            if ! curl -fsS --retry 2 --max-time 12 --retry-delay 2 \
                --data-urlencode "query=select ?s where { service <$${NANOPUB_QUERY_INTERNAL_URL}repo/meta> { select ?s where { ?s ?p ?o } limit 1 } }" \
                "http://localhost:8080/rdf4j-server/repositories/spaces" > /dev/null; then
              date >> /var/info/federation-restart
              restart_tomcat
              exit 1
            fi
          fi
          exit 0
        interval: 60s
        timeout: 60s
        start_period: 300s
