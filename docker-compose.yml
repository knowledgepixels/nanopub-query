services:
  query:
    build: .
    image: nanopub/query:latest
    restart: unless-stopped
    ports:
      - "9393:9393"
      # :9394 is only accessible from localhost as it is used for the /metrics endpoint
      - "127.0.0.1:9394:9394"
    volumes:
      # For the local nanopub loader (optional).
      # If not used, Query will load the nanopubs from the Registry with Jelly.
      - ./load:/app/load
    environment:
      - ENDPOINT_TYPE=rdf4j
      - ENDPOINT_BASE=http://rdf4j:8080/rdf4j-server/
      - REGISTRY_FIXED_URL=https://registry.knowledgepixels.com/
      - RDF4J_PROXY_HOST=rdf4j
    #     - INIT_WAIT_SECONDS=120   # Only used by the local nanopub loader
    # Public base URL, used only in generated documentation (grlc spec listings,
    # OpenAPI server URLs) — query execution never uses it:
    #     - NANOPUB_QUERY_URL=https://query.knowledgepixels.com/
    # In-cluster base URL used for rewriting SERVICE clauses / query endpoints;
    # defaults to http://query:9393/ (this service). Only set it if the app is
    # reachable under a different in-cluster address. Do NOT point it at the
    # public URL: federated /api traffic would then loop through the public
    # edge and compete with external clients for nginx's per-repo connection
    # limits (issue #142, incident 2026-07-28).
    #     - NANOPUB_QUERY_INTERNAL_URL=http://query:9393/
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  rdf4j:
    # Image with additional fixes:
    # - JDK 25 for better performance
    # - Fixed issue with federated query deadlocks
    # - Allowed for disabling transactions in text repos for faster writes
    # Source branch: https://github.com/Ostrzyciel/rdf4j/tree/piotr/merged-fixes-2025-12-10
    # (Commented out because it seems it doesn't have curl installed, which is needed for the healthcheck.)
    #image: ostrzyciel/rdf4j-workbench-tomcat:5.2.2-SNAPSHOT-b
    image: eclipse/rdf4j-workbench:6.0.0-tomcat
    restart: unless-stopped
    # Start as root so init.sh can apt-get install curl (missing from the
    # 5.3.1-tomcat image but required by the healthcheck). init.sh drops to
    # the tomcat user before launching the JVM.
    user: "0"
    environment:
      # maxConnPerRoute/maxConnTotal: all SERVICE clauses in /api queries are
      # rewritten to this instance's in-cluster URL (NANOPUB_QUERY_INTERNAL_URL,
      # default http://query:9393/), so the whole federation load shares a
      # single HttpClient route inside this container. The RDF4J defaults
      # (25 per route, 50 total) saturate under concurrent federated queries,
      # starving every /api call with "Timeout waiting for connection from
      # pool" (incident 2026-07-28). Keep the sum of concurrent outer queries
      # and federated self-calls below Tomcat's worker pool.
      #
      # That pool is 150, not the 200 Tomcat default this comment previously
      # assumed: the eclipse/rdf4j-workbench image ships a server.xml with
      # maxThreads="150" on every connector. With maxConnPerRoute=100 the worst
      # case was therefore 100 outer + 100 federated self-calls = 200 workers
      # against 150 — past the deadlock boundary the paragraph above is meant to
      # stay below, leaving nothing for the healthcheck probe or other repos.
      # 60 bounds the worst case at 120 and keeps real headroom. It also makes a
      # leaked-lease wedge (eclipse-rdf4j/rdf4j#5970) degrade rather than become
      # total, since fewer leases are needed before the route saturates; the
      # server-side idle timeout in MainVerticle now lets those leases expire.
      #
      # ExitOnOutOfMemoryError: without it, a heap OOM is survivable in the worst
      # possible way. On kpxl 2026-08-05 the OOM killed the "http-nio-8080-Acceptor"
      # thread (04:17:08) and then the Poller (04:17:30) while the JVM stayed alive
      # spinning in GC. With no acceptor, the socket stays bound but nothing ever
      # accepts: the backlog fills, the kernel drops SYNs, and every client sees a
      # 10 s connect timeout. The process never exits, so `restart: unless-stopped`
      # never fires, and with RDF4J_HEALTHCHECK_RESTART=off nothing else intervenes
      # — the instance sat wedged for 11 hours while still reporting READY.
      # Exiting on the first OOM turns that permanent outage into a ~2 min restart.
      # It also composes with the healthcheck decision rather than fighting it: the
      # JVM only dies when it is already unrecoverable, so this does not reintroduce
      # the mid-write kill risk of issue #142 that turning restarts off avoided.
      #
      # MaxRAMPercentage: the container has no mem_limit, so the JVM default of 25%
      # of *host* RAM applied. Pinning it makes the ceiling explicit and independent
      # of the host the stack lands on.
      #
      # HeapDumpOnOutOfMemoryError: /var/info is host-mounted (./data/info), so the
      # dump survives the exit above and can be opened after the fact. Sized in GB —
      # check free space there before enabling on a small host.
      #
      # PrintConcurrentLocks: makes a SIGQUIT (`kill -3`) thread dump include the
      # "Locked ownable synchronizers" block, i.e. which thread *owns* each
      # java.util.concurrent lock. Without it a plain kill -3 shows waiters but not
      # holders. On 2026-08-05 a dump showed 171 threads parked on one
      # SailSourceBranch ReentrantLock with no way to tell who held it, and the
      # image ships a JRE (no jcmd/jstack), so there was no second way to ask.
      # Zero runtime cost until a dump is requested.
      - JAVA_OPTS=-XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/info/ -XX:MaxRAMPercentage=${RDF4J_MAX_RAM_PERCENTAGE:-50} -XX:+PrintConcurrentLocks -Dorg.eclipse.rdf4j.client.http.connectionTimeout=10000 -Dorg.eclipse.rdf4j.client.http.connectionRequestTimeout=10000 -Dorg.eclipse.rdf4j.client.http.socketTimeout=10000 -Dorg.eclipse.rdf4j.client.http.maxConnPerRoute=60 -Dorg.eclipse.rdf4j.client.http.maxConnTotal=120
      # Used by the healthcheck's federation probe below; defaults to the same
      # in-cluster URL the SERVICE rewrite uses, so the probe tests the real
      # federation route. Set explicitly empty to disable the probe.
      - NANOPUB_QUERY_INTERNAL_URL=${NANOPUB_QUERY_INTERNAL_URL-http://query:9393/}
      # Whether a failing healthcheck probe may kill Tomcat. Off by default —
      # see the reasoning above the healthcheck test block.
      - RDF4J_HEALTHCHECK_RESTART=${RDF4J_HEALTHCHECK_RESTART:-off}
    volumes:
      - ./data/rdf4j/data:/var/rdf4j
      - ./data/rdf4j/logs:/usr/local/tomcat/logs
      - ./data/info:/var/info
      - ./entrypoint:/var/entrypoint
    ports:
      # Localhost only: RDF4J has no authentication, and every repository it
      # serves is writable, including via DELETE on the repository URL and via
      # the Workbench UI. Published on all interfaces it is an unauthenticated
      # write endpoint on the public IP, which bypasses whatever the reverse
      # proxy restricts. Note that a host firewall does not help here, since
      # Docker manages its own iptables rules. Reached as http://rdf4j:8080/
      # from the query container, and via the proxy on 127.0.0.1:8081.
      # (Compare the 2026-08-02 Solr wipe on vodex.petapico.org.)
      - "127.0.0.1:8081:8080"
    entrypoint: /var/entrypoint/init.sh
    # Docker's default grace period is 10 s, but a clean Tomcat shutdown here has to
    # close thousands of LMDB repos and measured ~100 s on kpxl (2026-07-31: kill at
    # 13:55:14, port closed 13:56:54). At 10 s every stop became a SIGKILL, which is
    # the hard-kill-mid-write condition implicated in issue #142. Forwarding SIGTERM
    # from init.sh is pointless without giving the shutdown room to finish.
    stop_grace_period: 120s
    healthcheck:
        # If the direct-query curl succeeds, mark the instance as "has been
        # ready". Only force a restart (via pkill) when a probe fails AND we've
        # previously seen it ready -- otherwise we'd kill Tomcat mid-deploy
        # during the start_period (default start_interval is 5s, well below the
        # war-deploy time).
        #
        # Second probe: SERVICE clauses in /api queries loop back through the
        # instance's in-cluster URL, so RDF4J's federation HTTP pool can wedge
        # (leaked connections; incident 2026-07-28) while direct queries stay
        # healthy. Probe that exact route and restart when it no longer
        # answers. Uses NANOPUB_QUERY_INTERNAL_URL (with trailing slash);
        # skipped when explicitly set to empty.
        # restart_tomcat gives Tomcat up to 60 s to stop gracefully before the
        # kill -9: dozens of LMDB repos need to close cleanly, and the previous
        # 10 s window meant effectively every restart was a hard kill — which
        # the 2026-07-29 incident (issue #142) showed can discard acknowledged
        # writes held in a wedged store. The 10-minute backoff prevents restart
        # storms: a persistently wedged repo used to trigger a kill every probe
        # interval, multiplying the data-loss windows; now the probe reports
        # unhealthy without re-killing until the backoff elapses.
        #
        # Auto-restart is OFF by default since 2026-07-31. Both probes still run
        # and still record failures, so a wedge is visible (container goes
        # unhealthy, timestamps land in /var/info/), but nothing kills Tomcat.
        #
        # Why: on 2026-07-31 the healthcheck killed Tomcat 10 times, 7 of them
        # between 12:00 and 13:55 — and it was not curing anything. Each cycle
        # cost ~110 s of downtime (13:55:14 kill -> 13:57:04 back up) and the
        # store re-wedged within 11-20 minutes, so the restart only reset a
        # clock. Meanwhile every kill is a roll of the issue #142 dice:
        # acknowledged, read-back-verified writes reverting. Trading a visible
        # degradation for silent data loss is the wrong way round.
        #
        # Attribution, so the next reader does not repeat our mistake: 8 of the
        # 10 kills came from the FIRST (direct-query) probe, only 2 from the
        # federation probe. /var/info/restart is the kill log;
        # /var/info/federation-restart is written *before* restart_tomcat, which
        # often returns early on the backoff — the two files are not comparable
        # counts. Disabling the federation probe alone would have prevented 2.
        #
        # Re-enable with RDF4J_HEALTHCHECK_RESTART=on once the underlying LMDB
        # ValueStore$ReadTxn leak is resolved upstream (still present in 5.3.2,
        # after #5807; see rdf4j-issue-draft.md).
        test: |
          restart_tomcat() {
            if [ "$$RDF4J_HEALTHCHECK_RESTART" != "on" ]; then
              date >> /var/info/restart-suppressed
              return
            fi
            if [ -f /var/info/restart ]; then
              last_s=$$(date -d "$$(tail -1 /var/info/restart)" +%s 2>/dev/null || echo 0)
              if [ $$(( $$(date +%s) - last_s )) -lt 600 ]; then
                return
              fi
            fi
            date >> /var/info/restart
            pkill -15 java
            i=0
            while [ $$i -lt 12 ] && pgrep java > /dev/null; do
              sleep 5
              i=$$((i + 1))
            done
            if pgrep java > /dev/null; then
              pkill -9 java
            fi
          }
          if ! curl -fsS --retry 2 --max-time 10 --retry-delay 2 --retry-max-time 10 --retry-connrefused \
              "http://localhost:8080/rdf4j-server/repositories/full?query=select%2Awhere%7B%3Fs%3Cx%3A%3E%3Fo%7Dlimit1" > /dev/null; then
            if [ -f /var/info/ready ]; then
              restart_tomcat
            fi
            exit 1
          fi
          touch /var/info/ready
          if [ -n "$$NANOPUB_QUERY_INTERNAL_URL" ]; then
            if ! curl -fsS --retry 2 --max-time 12 --retry-delay 2 \
                --data-urlencode "query=select ?s where { service <$${NANOPUB_QUERY_INTERNAL_URL}repo/meta> { select ?s where { ?s ?p ?o } limit 1 } }" \
                "http://localhost:8080/rdf4j-server/repositories/spaces" > /dev/null; then
              date >> /var/info/federation-restart
              restart_tomcat
              exit 1
            fi
          fi
          exit 0
        interval: 60s
        timeout: 60s
        start_period: 300s
